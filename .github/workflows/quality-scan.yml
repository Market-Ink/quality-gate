# Copy this file into a target project at .github/workflows/quality-scan.yml
# It runs the Quality Gate as a NON-BLOCKING, read-only check on pull requests
# and uploads the report as an artifact. It never fails the build and never
# changes code. Flip `continue-on-error` to false only once your team wants it
# to gate merges.
name: Quality Gate (scan)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write        # needed to post the report as a PR comment

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # needed so the scanner can diff against the base

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install the deterministic tools you want CI to run. The scanner skips any
      # tool that isn't present, so WITHOUT this step every check SKIPs and the
      # gate becomes a no-op — install what this repo actually uses.

      # JS/TS: install the repo's own dev deps so eslint/prettier/tsc are found in
      # node_modules/.bin. Runs only when a lockfile exists; a no-op otherwise.
      - name: Install project dev dependencies (JS/TS)
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock', 'pnpm-lock.yaml') != ''
        continue-on-error: true   # never fail the build; a failed install just means those checks SKIP
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --immutable || yarn install --frozen-lockfile
          else
            npm ci
          fi

      # Python: uncomment for repos that use Python tooling.
      # - name: Install Python scanners
      #   run: pip install ruff mypy bandit pip-audit

      - name: Fetch Quality Gate scanner
        run: git clone --depth 1 https://github.com/sarthakkk1212/quality-gate.git .quality-gate-tool

      - name: Run Quality Gate (read-only, non-blocking)
        continue-on-error: true
        run: >
          node .quality-gate-tool/scan.js
          --path .
          --base "origin/${{ github.base_ref }}"
          --no-ai
          --out quality-reports

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-reports/

      # Post a COMPACT verdict onto the PR so the thread stays readable. Only
      # checks that found something are listed here; the full report (every
      # check + full tool output) lives in the uploaded "quality-report"
      # artifact. Updates the same comment on re-runs instead of adding new ones.
      - name: Comment report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- marketink-quality-gate -->';
            const artifactHint =
              '_Full report (every check + tool output) is in the **quality-report** ' +
              'artifact on the [workflow run](' +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId})._`;

            // Read the structured report; fall back gracefully if the scan
            // step never produced one.
            let data = null;
            try {
              data = JSON.parse(fs.readFileSync('quality-reports/latest.json', 'utf8'));
            } catch {
              data = null;
            }

            let body;
            if (!data) {
              body = `${marker}\n## 🔍 MarketInk Quality Gate\n\n` +
                `❓ **No report produced** — the scan step may have failed to run.\n\n${artifactHint}`;
            } else {
              const checks = Array.isArray(data.checks) ? data.checks : [];
              const reviews = Array.isArray(data.reviews) ? data.reviews : [];

              // Anything the reviewer/tools flagged that a human should look at.
              const problems = checks.filter(c => c.status === 'FINDINGS' || c.status === 'ERROR');
              const aiProblems = reviews.filter(r => r.status === 'ERROR');

              const passed  = checks.filter(c => c.status === 'PASS').length;
              const skipped = checks.filter(c => c.status === 'SKIP' || c.status === 'OFF').length;
              const findings = checks.filter(c => c.status === 'FINDINGS').length;
              const info     = checks.filter(c => c.status === 'INFO').length;
              const errors   = checks.filter(c => c.status === 'ERROR').length;

              const clean = problems.length === 0 && aiProblems.length === 0;
              const verdict = clean
                ? '✅ **Passed** — no new issues in this PR'
                : findings
                  ? `⚠️ **Issues found** — ${findings} check(s) with new findings`
                  : '❌ **Errors** — one or more checks failed to run';

              const counts =
                `\`${passed} passed\` · \`${findings} findings\` · \`${info} info\` · ` +
                `\`${errors} errors\` · \`${skipped} skipped\``;

              const lines = [
                marker,
                '## 🔍 MarketInk Quality Gate',
                '',
                verdict,
                '',
                counts,
                '',
              ];

              if (!clean) {
                lines.push('| Check | Status | Note |', '|---|---|---|');
                const icon = { FINDINGS: '⚠️', ERROR: '❌' };
                for (const c of problems) {
                  const note = (c.note || '').replace(/\|/g, '\\|').split(/\r?\n/)[0].slice(0, 120);
                  lines.push(`| ${c.title} | ${icon[c.status] || c.status} ${c.status} | ${note} |`);
                }
                for (const r of aiProblems) {
                  lines.push(`| AI review (${r.prompt}) | ❌ ERROR | see artifact |`);
                }
                lines.push('');
              }

              lines.push(artifactHint);
              body = lines.join('\n');
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Reuse our previous comment if there is one (keeps the PR tidy).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
